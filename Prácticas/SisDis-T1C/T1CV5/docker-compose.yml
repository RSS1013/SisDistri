version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_distribuido
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sisdis-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-python:
    build: ./api-python
    container_name: api-python
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - sisdis-net

  frontend-springboot:
    build: ./frontend-springboot
    container_name: frontend-springboot
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      api-python:
        condition: service_started
    networks:
      - sisdis-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sistema_distribuido
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

networks:
  sisdis-net:
    driver: bridge
