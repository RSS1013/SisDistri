<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <header>
        <div class="logo">ExceptTester</div>
        <nav>
            <a th:href="@{/usuarios}">Volver</a>
            <a th:href="@{/logout}">Logout</a>
        </nav>
    </header>

    <main class="container">
        <h1 th:text="${usuario.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}"></h1>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" th:field="*{username}" required />
            </div>

            <div class="form-group">
                <label for="roles">Roles asignados</label>
                <select id="roles" name="roles" multiple th:field="*{roles}">
                    <option th:each="rol : ${rolesDisponibles}" 
                            th:value="${rol.id}" 
                            th:text="${rol.nombre}">
                    </option>
                </select>
                <small>Pulsa Ctrl (Windows) o Cmd (Mac) para seleccionar varios</small>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" required />
            </div>

            <button type="submit" class="btn mt-2">Guardar</button>
        </form>
    </main>
</body>
</html>
