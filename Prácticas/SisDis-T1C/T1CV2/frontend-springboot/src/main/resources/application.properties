# Configuracion para MySQL en Docker
spring.application.name=SisDisP2

spring.datasource.url=jdbc:mysql://mysql:3306/sistema_distribuido
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Desactivamos cache en desarrollo
spring.thymeleaf.cache=false

# Configuracion de recursos estaticos
spring.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**
#spring.web.resources.static-locations=classpath:/custom-static/

# Si utilizamos H2 para pruebas descomentamos lo siguiente.
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver

# ponemos debug que no veo el porblema que da al hacer login con bcrypt
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
