# Configuracion para MySQL en Docker
spring.application.name=SisDisP2

spring.datasource.url=jdbc:mysql://mysql:3306/sistema_distribuido
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Desactivamos cache en desarrollo
spring.thymeleaf.cache=false

# Recursos estáticos
spring.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

# Log para depuración de errores en login
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
