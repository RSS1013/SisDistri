<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <header>
        <div class="logo">ExceptTester</div>
        <nav>
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/logout}">Logout</a>
        </nav>
    </header>

    <main class="container">
        <h1>Usuarios Registrados</h1>

        <div class="text-right mb-3">
            <a class="btn" th:href="@{/usuarios/nuevo}">+ Nuevo Usuario</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.username}"></td>
                    <td>
                        <a class="btn btn-small" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                        <a class="btn btn-small btn-danger" th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                           onclick="return confirm('¿Estás seguro de eliminar este usuario?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
